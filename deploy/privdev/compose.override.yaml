# PrivDev Study 1 deployment override for AgentBox.
#
# Used together with the upstream docker-compose.yaml, once per instance:
#
#   docker compose -p annotaise-test \
#     -f docker-compose.yaml -f deploy/privdev/compose.override.yaml \
#     --env-file deploy/privdev/annotaise-test/.env up -d --build
#
# (deploy/privdev/README.md wraps this in a helper.) The project name gives
# each instance its own containers, network and volumes. Each instance's .env
# is written from the AgentBox secret store and is git-ignored.
#
# Topology per instance: one loopback port (GATEWAY_PORT) -> nginx gateway.
# Tailscale Serve/Funnel mounts the instance at NEXT_PUBLIC_BASE_PATH and strips
# that prefix before proxying, so the gateway sees unprefixed paths:
#   /backend/static/*  -> collected Django static files (volume)
#   /backend/*         -> Django API (gunicorn), prefix stripped;
#                         Django knows its public prefix via DJANGO_FORCE_SCRIPT_NAME
#   /*                 -> Next.js frontend, NEXT_PUBLIC_BASE_PATH re-added
#                         (Next.js runs with basePath = NEXT_PUBLIC_BASE_PATH)
# The API sits under /backend because several API routes (e.g. /labelings/...)
# share names with frontend pages.

services:
  api:
    # No source bind mounts: run the code baked into the image.
    volumes: !override
      - static_volume_annotaise:/app/static
      - media_annotaise:/app/media
    ports: !reset []
    environment:
      DEBUG: ${DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      DJANGO_DB_PASS: ${DJANGO_DB_PASS:?DJANGO_DB_PASS must be set}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS must be set}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      DJANGO_FORCE_SCRIPT_NAME: ${DJANGO_FORCE_SCRIPT_NAME:-}
      DJANGO_COOKIE_DOMAIN: ""
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
    restart: unless-stopped

  frontend:
    # Deploy image: `npm ci` + `next build` at image build time with the
    # NEXT_PUBLIC_* values as build args; the container only runs `next start`
    # (no network install or rebuild on restart). Rebuild after changing them.
    build: !override
      context: ./frontend
      dockerfile: ../deploy/privdev/frontend.Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:?NEXT_PUBLIC_BASE_PATH must be set}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL must be set}
    env_file: !reset []
    volumes: !reset []
    ports: !reset []
    environment: !override
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped

  db:
    ports: !reset []
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - frontend
    ports:
      - "127.0.0.1:${GATEWAY_PORT:?GATEWAY_PORT must be set}:8080"
    volumes:
      - static_volume_annotaise:/srv/static:ro
    configs:
      - source: gateway_conf
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped

configs:
  gateway_conf:
    # GATEWAY_HIDE_ADMIN=1 (written by write-env.sh for annotaise-study only)
    # answers 404 for the Django admin, the API docs/schema and self-registration,
    # none of which the annotator UI or the PrivDev export account use. $uri is
    # nginx's decoded, slash-merged path, so encoded or doubled slashes match too.
    content: |
      map $$uri $$privdev_hidden {
        default 0;
        "~^/backend/(admin|api/docs|api/redoc|api/schema|api/auth/register)([/.]|$$)" ${GATEWAY_HIDE_ADMIN:-0};
      }

      server {
        listen 8080;
        server_name _;
        client_max_body_size 500M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        if ($$privdev_hidden) {
          return 404;
        }

        location /backend/static/ {
          alias /srv/static/;
        }

        location /backend/ {
          proxy_pass http://api:8000/;
          proxy_set_header Host $$http_host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
        }

        # Next.js serves its basePath root without a trailing slash.
        location = / {
          proxy_pass http://frontend:3000${NEXT_PUBLIC_BASE_PATH};
          proxy_set_header Host $$http_host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
        }

        location / {
          proxy_pass http://frontend:3000${NEXT_PUBLIC_BASE_PATH}/;
          proxy_set_header Host $$http_host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
        }
      }

volumes:
  # pg_annotaise and static_volume_annotaise come from the upstream file;
  # the project name (-p) prefixes all of them per instance.
  media_annotaise:
